query CalledSets($slug: String, $id: ID) {
	event(slug: $slug, id: $id){
    sets(page: 0, perPage: 100,filters: {
      state: [2, 6]
    }){
      nodes {
        state
        startedAt
        fullRoundText
      	slots {
          entrant {
            name
          }
        }
      }
    }
  }
}