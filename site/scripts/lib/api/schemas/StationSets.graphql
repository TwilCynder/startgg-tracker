query Test($slug: String, $id: ID, $page: Int, $perPage: Int){
    event(slug: $slug, id: $id) {
        sets(page: $page, perPage: $perPage){
            nodes {
                id
                station {
                    number
                }
                stream {
                    streamName
                }
                slots {
                    entrant {
                        name
                    }
                }
            }
        }
    }
}