<!DOCTYPE html>
<html>
    <head>
        <script src = "../scripts/lib/jquery.js"></script>
        <meta charset="utf-8" />
        <link rel="icon" href="../assets/icon/startggtracker256.png">
        <link rel="stylesheet" href="../styles/main.css">
        <link rel="stylesheet" href="../styles/sets-display.css">
        <link rel="stylesheet" href="../styles/set-tracking-pages.css">
        <link rel="stylesheet" href="../styles/event_sets.css">
        <link rel="stylesheet" href="../styles/login.css">
    </head>
    <body>
        <div class = "login-overlay-container">
            <div class = "login-overlay"></div>
            <div class = "login-container flex-center vertical">
                This pages requires start.gg login.
                <a class="startgg-login-button" href="/oauth"><img src="/assets/startgg.ico" class="startgg-login-icon"/><span>Log in with Start.gg</span></a>
                <div class = "flex-center vertical" style="gap: 10px;">
                    <span>... or use an <a href="https://developer.start.gg/docs/authentication/">API Key</a></span>
                    <div class = "flex-center horizontal token-container">
                        <input type = "text" id="api-key-input" class = "token-input" name="apikey" required size="32" minlength="32" maxlength="32"/>
                        <input type="button" id="api-key-start-button" class = "button api-start-button" value="Start"/>
                    </div>
                </div>
            </div>
        </div>
        <div class = "header">
            <a class = "logo" href="../index.html"><img class = "logo" src="../assets/icon/startggtracker256.png"></a>
            <div class = "sggt-container"><a class="sggt" href = "../index.html">SggT</a> <div class = "pub">by TwilCynder</div> </div>
            <div class = "event-input-container">Event : <input class = "input event-input" type="text"><div class ="button">GO</div></div>
        </div>
        <div class = "content double-column"></div>
        <script src = "/scripts/event_sets.js" type="module"></script>
    </body>
</html>
